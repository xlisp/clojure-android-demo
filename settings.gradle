pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo.clojars.org' }   // nREPL is published to Clojars
        maven { url 'https://jitpack.io' }         // MPAndroidChart is published to JitPack
    }
}

rootProject.name = "clojure-android-demo"
include ':app'
