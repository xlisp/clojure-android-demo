plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.clojuredemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.clojuredemo"
        minSdk 26               // d8 + InMemoryDexClassLoader (DalvikDynamicClassLoader) needs API >= 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true    // Clojure + r8 blow past the 64K method limit
    }

    sourceSets {
        // Package src/main/clojure/**.clj as APK resources so `(require 'demo.ui)`
        // can locate + compile them on-device (no build-time Clojure AOT here).
        main { resources.srcDirs += ['src/main/clojure'] }
    }

    buildTypes {
        release {
            // Clojure relies on reflection heavily; keep shrinking off for the demo.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Several Clojure/r8 jars ship overlapping metadata files.
            excludes += ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module',
                         'data_readers.clj', 'data_readers.cljc']
            pickFirsts += ['**/*.clj', '**/*.cljc', '**/*.cljs']
        }
    }
}

dependencies {
    // The patched Clojure built by ../clojure/build-jar.sh, plus its two AOT deps.
    implementation files('libs/clojure-1.13.0-master-SNAPSHOT.jar')
    implementation files('libs/spec.alpha-0.5.238.jar')
    implementation files('libs/core.specs.alpha-0.4.74.jar')

    // d8/r8 translator, run ON the device by DalvikDynamicClassLoader to turn
    // Clojure-generated JVM bytecode into DEX at eval time.
    implementation 'com.android.tools:r8:8.2.47'

    // Remote nREPL server (so Emacs CIDER can connect). nREPL ships pure .clj
    // sources; they ride the same on-device d8 compile path as user eval.
    // Exclude its clojure dep -- we run the patched 1.13 from libs/ above.
    implementation('nrepl:nrepl:1.0.0') {
        exclude group: 'org.clojure', module: 'clojure'
    }

    // Official Java MCP SDK — used by demo/mcp.clj to run a Model Context Protocol
    // server ON the device (over a ServerSocket, mirroring the on-device nREPL).
    // Pulls Jackson 3 + Reactor + a JSON-schema validator; bundled (and DEX'd) at
    // build time like any other dependency, then driven from on-device Clojure.
    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.3'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'   // left navigation drawer

    // K-line chart + HTTP for demo/kline.clj. Both are ordinary build-time deps:
    // DEX'd into the APK, loaded by the app PathClassLoader, then referenced from
    // on-device-compiled Clojure (the generated classes' parent loader sees them).
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'   // LineChart (JitPack)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
